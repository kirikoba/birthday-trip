<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Birthday Trip</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       ログイン画面
  ========================== -->
  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <p class="login-small">
        Welcome
      </p>

      <h1>
        Birthday Trip
      </h1>

      <p class="login-message">
        あいことばを入力してね
      </p>

      <div class="password-wrap">
        <input
            type="password"
            id="passwordInput"
            placeholder="あいことば"
          >

        <button
          type="button"
          id="togglePassword"
          class="toggle-password"
        >
          👁
        </button>
      </div>

      <button id="loginButton">
        はじめる
      </button>

      <p id="loginError" class="login-error"></p>

    </div>

  </section>


<!-- =========================
     まだ旅行日前
========================== -->
<section id="beforeTripScreen" class="hidden">
  <div class="card">
    <p>もう少しだけ待ってね</p>

    <h1>Birthday Trip</h1>

    <p>
      当日になったら<br>
      もう一度ログインしてね！
    </p>

    <div class="island">
      🌱
    </div>
  </div>
</section>


<!-- =========================
     旅行メニュー
========================== -->
<section id="tripMenuScreen" class="hidden">

  <div class="card">

    <p class="small-text">
      Welcome
    </p>

    <h1>
      Birthday Trip
    </h1>

    <button id="startTripButton">
      たびをはじめる
    </button>

    <button
      id="memoryButton"
      disabled
    >
      思い出を見返す
    </button>

    <p id="memoryMessage">
      旅をしたあとに見られるよ
    </p>

  </div>

</section>

  <script src="script.js"></script>

</body>

</html>
