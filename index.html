<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Trip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-wrap">

    <!-- =========================
         ログイン画面
    ========================== -->
    <section id="loginScreen" class="screen">
      <div class="leaf-card login-card">

        <p class="small-welcome">Welcome</p>

        <div class="title-logo">
          <div class="title-row">
            <span class="title-box orange">B</span>
            <span class="title-box green">I</span>
            <span class="title-box pink">R</span>
            <span class="title-box blue">T</span>
            <span class="title-box yellow">H</span>
          </div>
          <div class="title-row">
            <span class="title-box lime">D</span>
            <span class="title-box coral">A</span>
            <span class="title-box sky">Y</span>
          </div>
          <div class="title-row">
            <span class="title-box orange">T</span>
            <span class="title-box green">R</span>
            <span class="title-box pink">I</span>
            <span class="title-box tree-box">P</span>
          </div>
        </div>

        <p class="message-text">あいことばを入力してね</p>

        <div class="password-wrap">
          <input
            type="password"
            id="passwordInput"
            placeholder="あいことば"
          >
          <button type="button" id="togglePassword" class="eye-button">👁</button>
        </div>

        <button id="loginButton" class="wood-button big-wood">
          <span>はじめる</span>
        </button>

        <p id="loginError" class="error-text"></p>
      </div>
    </section>

    <!-- =========================
         ログイン後のメイン画面
    ========================== -->
    <section id="mainScreen" class="screen hidden">
      <div class="leaf-card main-card">

        <p class="small-welcome">Welcome to</p>

        <div class="title-logo">
          <div class="title-row">
            <span class="title-box orange">B</span>
            <span class="title-box green">I</span>
            <span class="title-box pink">R</span>
            <span class="title-box blue">T</span>
            <span class="title-box yellow">H</span>
          </div>
          <div class="title-row">
            <span class="title-box lime">D</span>
            <span class="title-box coral">A</span>
            <span class="title-box sky">Y</span>
          </div>
          <div class="title-row">
            <span class="title-box orange">T</span>
            <span class="title-box green">R</span>
            <span class="title-box pink">I</span>
            <span class="title-box tree-box">P</span>
          </div>
        </div>

        <p class="sub-text">ふたりだけの特別な旅へ</p>

        <!-- 日付による案内文を出したい時に使える -->
        <p id="dateMessage" class="date-message"></p>

        <div class="menu-buttons">
          <button id="startTripButton" class="wood-button">
            🌿 たびをはじめる
          </button>

          <button id="memoryButton" class="wood-button wood-button-dark">
            📷 思い出を見返す
          </button>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
